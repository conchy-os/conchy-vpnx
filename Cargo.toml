[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Conchy OS Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/conchy-os/conchy-vpnx"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "process", "net", "io-util"] }
zbus = "5"
futures-util = "0.3"
serde_json = "1"
kdl = "4.6"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
xattr = "1"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"
vpnx-core = { path = "crates/core" }
vpnx-client = { path = "crates/client" }
